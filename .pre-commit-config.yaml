exclude: ^crates/(ctrader/proto|lse/docs-snapshot)/
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  # nautilus-engineering: sync begin
  - repo: local
    hooks:
      - id: check-nautilus-engineering-sync
        name: check nautilus_engineering sync
        entry: bash scripts/check-nautilus-engineering-sync.bash --staged
        language: system
        pass_filenames: false
        always_run: true
      - id: check-nautilus-engineering-pre-commit
        name: check nautilus_engineering pre-commit section
        entry: python3 scripts/manage-nautilus-engineering-pre-commit.py check --staged
        language: system
        pass_filenames: false
        always_run: true
  # nautilus-engineering: sync end

  ##############################################################################
  #  General checks
  ##############################################################################
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: forbid-new-submodules
      - id: end-of-file-fixer
        types_or: [rust, markdown, toml]
      - id: mixed-line-ending
      - id: trailing-whitespace
      - id: detect-private-key
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-illegal-windows-names
      - id: check-json
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml

  # nautilus-engineering: hooks begin
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        args: ["--staged", "--redact"]

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.24.2
    hooks:
      - id: markdownlint-cli2
        name: markdownlint
        entry: markdownlint-cli2
        args:
          - --config
          - .markdownlint.jsonc
          - --fix
        files: "\\.md$"

  - repo: local
    hooks:
      - id: check-markdown-tables
        name: normalize markdown table padding
        description: Pads GFM table columns to their widest cell, which MD060 does not check
        entry: python3 -B scripts/check-markdown-tables.py
        language: system
        types: [markdown]

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.14.1-1
    hooks:
      - id: shfmt
        args: ["-i", "2", "-ci", "-sr", "-ln", "bash", "-w"]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1-1
    hooks:
      - id: shellcheck

  - repo: local
    hooks:
      - id: taplo-format
        name: taplo-format
        entry: taplo format
        language: rust
        types: [toml]
        additional_dependencies:
          - cli:taplo-cli:0.10.0

  - repo: https://github.com/crate-ci/typos
    rev: v1.52.2
    hooks:
      - id: typos
        args: ["--force-exclude"]
        types: [text]

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [--strict]

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.32.0
    hooks:
      - id: zizmor
        name: zizmor (security)
        description: Scans GitHub Actions workflows for security misconfigurations
        args: ["--no-online-audits", "--strict-collection", "--min-severity", "informational", ".github/"]
        files: ^\.github/(workflows/[^/]+|(?:.*/)?action|dependabot)\.ya?ml$
        pass_filenames: false
  # nautilus-engineering: hooks end

  - repo: https://github.com/google/yamlfmt
    rev: v0.21.0
    hooks:
      - id: yamlfmt
        # The vendored files stay as nautilus_engineering writes them
        exclude: ^(\.nautilus-engineering/|\.yamllint\.yaml$)

  - repo: https://github.com/Mateusz-Grzelinski/actionlint-py
    rev: v1.7.12.24
    hooks:
      - id: actionlint
        name: actionlint (syntax/structure)
        description: Checks GitHub Actions workflow syntax and structural correctness

  ##############################################################################
  #  Custom hooks
  ##############################################################################
  - repo: local
    hooks:
      - id: check-workarounds
        name: check workarounds cite their issue
        description: A workaround cites the nautilus_trader or helix-trader issue that retires it
        entry: python3 -B .pre-commit-hooks/check_workarounds.py
        language: system
        types_or: [rust, markdown]

      - id: check-release-entries
        name: check release entries are short
        description: Each entry of the release in progress is one line of 160 characters at most
        entry: python3 -B .pre-commit-hooks/check_release_entries.py
        language: system
        files: ^RELEASES\.md$

      - id: check-hidden-chars
        name: check hidden unicode/control chars
        description: Fail on hidden control or zero-width unicode characters in source
        entry: bash .pre-commit-hooks/check_hidden_chars.sh
        language: system
        types_or: [rust, python, toml, markdown, yaml, json, text]
        files: "\\.(rs|py|toml|md|yml|yaml|json|sh|bash|dockerfile)$|Dockerfile.*"

      - id: check-unicode-typography
        name: check Unicode typography
        description: Reject non-breaking hyphens, typographic dashes, curly quotes, and emoji-style check/cross marks
        entry: bash .pre-commit-hooks/check_unicode_typography.sh
        language: system
        types: [text]

      - id: check-non-latin-text
        name: check non-Latin text
        description: Detect non-Latin characters (CJK, Cyrillic, Arabic, etc.) to enforce English-only
        entry: bash .pre-commit-hooks/check_non_latin_text.sh
        language: system
        types: [text]
        files: "\\.(rs|py|md|toml|yaml|yml)$"

      - id: check-error-conventions
        name: check error conventions
        description: Enforces error variable naming conventions
        entry: bash .pre-commit-hooks/check_error_conventions.sh
        language: system
        types_or: [rust, python]
        pass_filenames: false

      - id: check-links-offline
        name: check links (offline)
        description: Verifies all tracked internal markdown links resolve on disk via lychee
        entry: bash .pre-commit-hooks/check_links_offline.sh
        language: system
        always_run: true
        pass_filenames: false

      - id: test-check-workarounds
        name: test check-workarounds
        entry: python3 -B .pre-commit-hooks/test_check_workarounds.py
        language: system
        files: ^\.pre-commit-hooks/(test_)?check_workarounds\.py$
        pass_filenames: false

      - id: test-check-release-entries
        name: test check-release-entries
        entry: python3 -B .pre-commit-hooks/test_check_release_entries.py
        language: system
        files: ^\.pre-commit-hooks/(test_)?check_release_entries\.py$
        pass_filenames: false

      - id: check-commit-message
        name: check commit message
        description: A capitalized subject of 60 characters at most, a body wrapped at 79, no AI attribution
        entry: python3 -B .pre-commit-hooks/check_commit_message.py
        language: system
        stages: [commit-msg]
        always_run: true

  ##############################################################################
  #  Rust formatting and linting
  ##############################################################################
  - repo: local
    hooks:
      - id: check-anyhow-usage
        name: check anyhow usage
        description: Enforces anyhow conventions
        entry: bash .pre-commit-hooks/check_anyhow_usage.sh
        language: system
        files: "\\.rs$"
        pass_filenames: false

      - id: check-logging-conventions
        name: check logging conventions
        description: Enforces logging and process termination conventions
        entry: bash .pre-commit-hooks/check_logging_conventions.sh
        language: system
        files: "\\.rs$"
        pass_filenames: false

      - id: check-tokio-usage
        name: check tokio usage
        description: Enforces tokio usage conventions
        entry: bash .pre-commit-hooks/check_tokio_usage.sh
        language: system
        files: "\\.rs$|Cargo\\.toml$"
        pass_filenames: false

      - id: check-testing-conventions
        name: check testing conventions
        description: Enforces testing standardizations and conventions
        entry: bash .pre-commit-hooks/check_testing_conventions.sh
        language: system
        types_or: [rust, python]
        pass_filenames: false

      - id: check-nautilus-conventions
        name: check nautilus conventions
        description: Enforces Nautilus type usage conventions
        entry: bash .pre-commit-hooks/check_nautilus_conventions.sh
        language: system
        files: "\\.rs$"
        pass_filenames: false

      - id: check-formatting-rs
        name: check formatting (Rust)
        description: Enforces formatting conventions in Rust code
        entry: bash .pre-commit-hooks/check_formatting_rs.sh
        language: system
        files: "\\.rs$"
        pass_filenames: false

      - id: check-docs-conventions
        name: check docs conventions
        description: Enforces documentation conventions
        entry: bash .pre-commit-hooks/check_docs_conventions.sh
        language: system
        files: "(Cargo\\.toml|\\.(rs|md))$"
        pass_filenames: false

      - id: check-cargo-conventions
        name: check cargo conventions
        description: Enforces Cargo.toml dependency ordering conventions
        entry: bash .pre-commit-hooks/check_cargo_conventions.sh
        language: system
        files: "Cargo\\.toml$"
        pass_filenames: false

      - id: fmt
        name: cargo fmt
        description: Check formatting with the nightly rustfmt that rustfmt.toml's import options need
        entry: cargo +nightly fmt
        language: system
        args: ["--all", "--", "--check"]
        files: >-
          (?x)^(
            .*\.rs|
            (?:.*/)?Cargo\.toml|
            rustfmt\.toml
          )$
        types: [file]
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        description: Run Clippy with Nautilus' workspace lints on every crate and target
        entry: cargo clippy
        language: system
        args: ["--workspace", "--all-targets", "--features", "strategy-tests", "--", "-D", "warnings"]
        files: >-
          (?x)^(
            .*\.rs|
            (?:.*/)?Cargo\.toml|
            Cargo\.lock|
            clippy\.toml|
            \.cargo/config\.toml
          )$
        types: [file]
        pass_filenames: false

      - id: cargo-doc
        name: cargo doc
        description: Build every crate's docs with warnings denied, intra-doc links resolved
        entry: env RUSTDOCFLAGS=-Dwarnings cargo doc
        language: system
        args: ["--workspace", "--no-deps"]
        files: >-
          (?x)^(
            .*\.rs|
            (?:.*/)?Cargo\.toml|
            Cargo\.lock
          )$
        types: [file]
        pass_filenames: false

      - id: cargo-machete
        name: cargo machete
        description: Detect declared-but-unused dependencies
        entry: cargo machete
        language: system
        files: >-
          (?x)^(
            .*\.rs|
            (?:.*/)?Cargo\.toml
          )$
        pass_filenames: false

      - id: cargo-cooldown
        name: cargo cooldown
        description: Blocks crate versions published inside the cooldown window
        entry: >-
          bash -c 'bash scripts/check-cargo-cooldown.sh --all
          --cache "${CARGO_TARGET_DIR:-target}/.cargo-cooldown.json"'
        language: system
        files: >-
          (?x)^(
            (?:.*/)?Cargo\.(lock|toml)|
            \.supply-chain/crate-dates\.json|
            scripts/check-cargo-cooldown\.sh
          )$
        pass_filenames: false

      - id: cargo-deny
        name: cargo deny
        description: Advisories, licenses, banned and duplicate crates, and sources (deny.toml)
        entry: cargo deny check
        language: system
        files: >-
          (?x)^(
            (?:.*/)?Cargo\.(lock|toml)|
            deny\.toml
          )$
        pass_filenames: false
