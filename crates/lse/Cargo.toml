[package]
name = "lse"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
# The mock LSE peer and its captured payloads (`testing`), for a caller's
# tests of its own fill through the adapter, as the cTrader crate exposes
# its hooks.
test-support = ["dep:tungstenite"]

[dependencies]
# The maps and sets of the sockets' state, as Nautilus' adapter guide asks
# ("Adapter-owned state").
ahash = "0.8"
anyhow.workspace = true
# The columns of an export's Parquet file, and a row's fields as JSON, its
# times in their named zone, LSE's UTC (chrono-tz).
arrow = { workspace = true, features = ["chrono-tz", "json"] }
# The `DataClient` trait of the data client.
async-trait.workspace = true
bon.workspace = true
# The body of Nautilus' HTTP responses.
bytes = "1"
# The records of LSE's CME stream, Databento's, at the version Nautilus'
# Databento decoders take.
dbn = { version = "0.71", default-features = false }
jiff.workspace = true
log.workspace = true
nautilus-common = { workspace = true, features = ["live"] }
nautilus-core.workspace = true
# Nautilus' Databento decoders, which turn the CME stream's records into
# quotes and trades.
nautilus-databento.workspace = true
nautilus-live.workspace = true
nautilus-model.workspace = true
nautilus-network.workspace = true
# The arrow encoding and registry of the custom data type of LSE's rows.
nautilus-serialization = { workspace = true, features = ["arrow"] }
# The version Nautilus' persistence reads with, and the codec LSE's exports
# are compressed with.
parquet = { version = "59.3", default-features = false, features = ["arrow", "zstd"] }
rust_decimal.workspace = true
serde.workspace = true
serde_json.workspace = true
# The SHA-256 an export's file is checked by.
sha2.workspace = true
thiserror = "2"
# The lock of the one download at a time.
tokio = { workspace = true, features = ["sync"] }
# The mock LSE socket of `testing`.
tungstenite = { version = "0.30", optional = true }

[dev-dependencies]
# The data tester's: the key from `.env`, the node's catalog (registered
# through nautilus-live's `streaming`) and Nautilus' `DataTester`, which
# the tests drive the data client with on a node too.
dotenvy = "0.15"
nautilus-live = { workspace = true, features = ["streaming"] }
nautilus-model = { workspace = true, features = ["test-support"] }
nautilus-persistence.workspace = true
nautilus-testkit.workspace = true
# Test functions, as Nautilus' adapter guide has them ("Rust testing"),
# declared as Nautilus declares it.
rstest = { version = "0.28.0", default-features = false }
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
# The mock LSE socket of the crate's tests.
tungstenite = "0.30"

# Nautilus' data tester on LSE (see the README, "Data testing"), on the
# crate's test definitions.
[[example]]
name = "lse-data-tester"
path = "examples/node_data_tester.rs"
required-features = ["test-support"]
