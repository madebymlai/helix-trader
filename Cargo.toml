[package]
name = "helix-trader"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[workspace]
members = ["crates/ctrader", "crates/lse"]
# Plain `cargo test` and `cargo clippy` at the root cover every crate.
default-members = [".", "crates/ctrader", "crates/lse"]

[workspace.package]
edition = "2024"
rust-version = "1.99.1"

# The Nautilus pin, one for the workspace, so that every crate builds
# against one copy of Nautilus' types; and the versions the crates share.
# Each crate names the features it needs.
[workspace.dependencies]
anyhow = "1"
# The arrow schema of Nautilus' custom data macros, and of LSE's exports.
arrow = { version = "59.3", default-features = false }
async-trait = "0.1"
bon = "=3.9.3"
ctrader = { path = "crates/ctrader" }
jiff = { version = "0.2", features = ["serde"] }
log = "0.4"
lse = { path = "crates/lse" }
nautilus-analysis = { git = "https://github.com/nautechsystems/nautilus_trader", rev = "8b184c8af85068d788b591e10cb900fa2aba2cf2" }
nautilus-backtest = { git = "https://github.com/nautechsystems/nautilus_trader", rev = "8b184c8af85068d788b591e10cb900fa2aba2cf2" }
nautilus-common = { git = "https://github.com/nautechsystems/nautilus_trader", rev = "8b184c8af85068d788b591e10cb900fa2aba2cf2" }
nautilus-core = { git = "https://github.com/nautechsystems/nautilus_trader", rev = "8b184c8af85068d788b591e10cb900fa2aba2cf2" }
nautilus-data = { git = "https://github.com/nautechsystems/nautilus_trader", rev = "8b184c8af85068d788b591e10cb900fa2aba2cf2" }
# Keep Nautilus' 64-bit prices, as for nautilus-okx.
nautilus-databento = { git = "https://github.com/nautechsystems/nautilus_trader", rev = "8b184c8af85068d788b591e10cb900fa2aba2cf2", default-features = false }
nautilus-execution = { git = "https://github.com/nautechsystems/nautilus_trader", rev = "8b184c8af85068d788b591e10cb900fa2aba2cf2" }
nautilus-indicators = { git = "https://github.com/nautechsystems/nautilus_trader", rev = "8b184c8af85068d788b591e10cb900fa2aba2cf2" }
nautilus-infrastructure = { git = "https://github.com/nautechsystems/nautilus_trader", rev = "8b184c8af85068d788b591e10cb900fa2aba2cf2" }
nautilus-interactive-brokers = { git = "https://github.com/nautechsystems/nautilus_trader", rev = "8b184c8af85068d788b591e10cb900fa2aba2cf2", default-features = false }
nautilus-live = { git = "https://github.com/nautechsystems/nautilus_trader", rev = "8b184c8af85068d788b591e10cb900fa2aba2cf2" }
nautilus-model = { git = "https://github.com/nautechsystems/nautilus_trader", rev = "8b184c8af85068d788b591e10cb900fa2aba2cf2" }
nautilus-network = { git = "https://github.com/nautechsystems/nautilus_trader", rev = "8b184c8af85068d788b591e10cb900fa2aba2cf2" }
# Keep Nautilus' 64-bit prices: the crate's default turns on 128-bit prices
# (high-precision) for the whole build.
nautilus-okx = { git = "https://github.com/nautechsystems/nautilus_trader", rev = "8b184c8af85068d788b591e10cb900fa2aba2cf2", default-features = false }
nautilus-persistence = { git = "https://github.com/nautechsystems/nautilus_trader", rev = "8b184c8af85068d788b591e10cb900fa2aba2cf2" }
nautilus-portfolio = { git = "https://github.com/nautechsystems/nautilus_trader", rev = "8b184c8af85068d788b591e10cb900fa2aba2cf2" }
nautilus-risk = { git = "https://github.com/nautechsystems/nautilus_trader", rev = "8b184c8af85068d788b591e10cb900fa2aba2cf2" }
nautilus-serialization = { git = "https://github.com/nautechsystems/nautilus_trader", rev = "8b184c8af85068d788b591e10cb900fa2aba2cf2" }
nautilus-trading = { git = "https://github.com/nautechsystems/nautilus_trader", rev = "8b184c8af85068d788b591e10cb900fa2aba2cf2" }
rust_decimal = "1"
serde = { version = "1", features = ["derive"] }
# Floats read back to the bit: the probes of a stored model.
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.11"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
ustr = "1"

[features]
# Strategy unit tests, off by default (see the README's tests section).
strategy-tests = []

[dependencies]
anyhow.workspace = true
# The arrow schema Nautilus' custom data macros generate, for the dataset
# rows and the custom data of the backtest tests.
arrow.workspace = true
# The version and features of Nautilus' IB gateway.
bollard = { version = "0.21.1", default-features = false, features = ["http", "pipe"] }
bon.workspace = true
clap = { version = "4", features = ["derive", "env"] }
# The cTrader Open API adapter, which the IC Markets and Pepperstone venues wire in.
ctrader.workspace = true
dotenvy = "0.15"
jiff.workspace = true
# LightGBM, built from its C++ sources (needs cmake and clang) without OpenMP:
# one thread, so training is deterministic. Cargo.lock gives its bindgen
# prettyplease 0.3: added beside bon's prettyplease 0.2, Cargo reused 0.2,
# whose syn 2 does not build with bindgen's syn 3.
lightgbm3 = "1.0.11"
log.workspace = true
# The LSE adapter, which the LSEDGE venue wires in.
lse.workspace = true
nautilus-analysis.workspace = true
nautilus-backtest = { workspace = true, features = ["streaming"] }
nautilus-common = { workspace = true, features = ["indicators", "live", "tracing-bridge"] }
nautilus-core.workspace = true
nautilus-data.workspace = true
# `live` for its data client, which fill-catalog's node asks for history.
nautilus-databento = { workspace = true, features = ["live"] }
nautilus-execution.workspace = true
nautilus-indicators.workspace = true
nautilus-infrastructure.workspace = true
nautilus-live = { workspace = true, features = ["streaming"] }
ibapi = "=5.0.0"
nautilus-interactive-brokers = { workspace = true, features = ["execution", "gateway"] }
nautilus-model.workspace = true
nautilus-network.workspace = true
nautilus-okx.workspace = true
nautilus-persistence.workspace = true
# Nautilus' custom data registry and arrow encoding, to store the dataset rows
# in the catalog.
nautilus-serialization = { workspace = true, features = ["arrow"] }
nautilus-trading.workspace = true
# PerpetualBooster: the 3.0 release candidate, the only version that builds
# on stable Rust.
perpetual = "=3.0.0-rc.2"
rust_decimal.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
tokio.workspace = true
toml = "1"
ustr.workspace = true

[dev-dependencies]
# The `DataClient` trait of the test venues' data clients.
async-trait.workspace = true
# The hooks of the demo test of the cTrader session's token renewal
# (`tests/live/ctrader_token_demo.rs`).
ctrader = { workspace = true, features = ["test-support"] }
# The mock LSE peer and its captured payloads, for the tests of the LSE fill.
lse = { workspace = true, features = ["test-support"] }
# Nautilus' Redis client, to delete what the live tests leave in the cache.
redis = { version = "1.7.1", default-features = false, features = ["tokio-comp"] }
nautilus-model = { workspace = true, features = ["test-support"] }
# Nautilus' portfolio, to register a strategy in a unit test.
nautilus-portfolio.workspace = true

# Line tables only for the workspace's crates, enough for file:line in
# backtraces, and no debug info for dependencies: Nautilus and DataFusion's full debug info made
# each test binary about 1.8 GB.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
