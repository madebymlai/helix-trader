[package]
name = "helix-trader"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"
publish = false

[dependencies]
anyhow = "1"
# The `DataClient` trait of the IC data client.
async-trait = "0.1"
# The version and features of Nautilus' IB gateway.
bollard = { version = "0.21.1", default-features = false, features = ["http", "pipe"] }
bon = "=3.9.3"
clap = { version = "4", features = ["derive", "env"] }
csv = "1"
# The version of nautilus-databento, for the cost quotes its client does not make.
databento = "=0.63.0"
dotenvy = "0.15"
jiff = { version = "0.2", features = ["serde"] }
log = "0.4"
nautilus-analysis = { git = "https://github.com/nautechsystems/nautilus_trader", rev = "a51ae015c150ef68f62d9295e3efa9534f492a4a" }
nautilus-backtest = { git = "https://github.com/nautechsystems/nautilus_trader", rev = "a51ae015c150ef68f62d9295e3efa9534f492a4a", features = ["streaming"] }
nautilus-common = { git = "https://github.com/nautechsystems/nautilus_trader", rev = "a51ae015c150ef68f62d9295e3efa9534f492a4a", features = ["live", "tracing-bridge"] }
nautilus-core = { git = "https://github.com/nautechsystems/nautilus_trader", rev = "a51ae015c150ef68f62d9295e3efa9534f492a4a" }
nautilus-data = { git = "https://github.com/nautechsystems/nautilus_trader", rev = "a51ae015c150ef68f62d9295e3efa9534f492a4a" }
# Keep Nautilus' 64-bit prices, as for nautilus-okx; the historical client needs no live feature.
nautilus-databento = { git = "https://github.com/nautechsystems/nautilus_trader", rev = "a51ae015c150ef68f62d9295e3efa9534f492a4a", default-features = false }
nautilus-execution = { git = "https://github.com/nautechsystems/nautilus_trader", rev = "a51ae015c150ef68f62d9295e3efa9534f492a4a" }
nautilus-indicators = { git = "https://github.com/nautechsystems/nautilus_trader", rev = "a51ae015c150ef68f62d9295e3efa9534f492a4a" }
nautilus-infrastructure = { git = "https://github.com/nautechsystems/nautilus_trader", rev = "a51ae015c150ef68f62d9295e3efa9534f492a4a" }
nautilus-live = { git = "https://github.com/nautechsystems/nautilus_trader", rev = "a51ae015c150ef68f62d9295e3efa9534f492a4a", features = ["streaming"] }
ibapi = "=5.0.0"
nautilus-interactive-brokers = { git = "https://github.com/nautechsystems/nautilus_trader", rev = "a51ae015c150ef68f62d9295e3efa9534f492a4a", default-features = false, features = ["execution", "gateway"] }
nautilus-model = { git = "https://github.com/nautechsystems/nautilus_trader", rev = "a51ae015c150ef68f62d9295e3efa9534f492a4a" }
nautilus-network = { git = "https://github.com/nautechsystems/nautilus_trader", rev = "a51ae015c150ef68f62d9295e3efa9534f492a4a" }
# Keep Nautilus' 64-bit prices: the crate's default turns on 128-bit prices
# (high-precision) for the whole build.
nautilus-okx = { git = "https://github.com/nautechsystems/nautilus_trader", rev = "a51ae015c150ef68f62d9295e3efa9534f492a4a", default-features = false }
nautilus-persistence = { git = "https://github.com/nautechsystems/nautilus_trader", rev = "a51ae015c150ef68f62d9295e3efa9534f492a4a" }
nautilus-serialization = { git = "https://github.com/nautechsystems/nautilus_trader", rev = "a51ae015c150ef68f62d9295e3efa9534f492a4a", features = ["arrow"] }
nautilus-trading = { git = "https://github.com/nautechsystems/nautilus_trader", rev = "a51ae015c150ef68f62d9295e3efa9534f492a4a" }
prost = "0.14"
rust_decimal = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The fingerprint of the IC token pair that seeded the token file.
sha2 = "0.11"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
toml = "1"
# The rate-limit keys of Nautilus' WebSocketClient.
ustr = "1"
zeroize = "1"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

[build-dependencies]
prost-build = { version = "0.14", default-features = false }

[dev-dependencies]
futures = "0.3"
# Nautilus' Redis client, to delete what the live tests leave in the cache.
redis = { version = "1.7.1", default-features = false, features = ["tokio-comp"] }
nautilus-model = { git = "https://github.com/nautechsystems/nautilus_trader", rev = "a51ae015c150ef68f62d9295e3efa9534f492a4a", features = ["test-support"] }
# Nautilus' risk engine and the portfolio it takes, for the IC margin check
# and to register a strategy in a unit test.
nautilus-portfolio = { git = "https://github.com/nautechsystems/nautilus_trader", rev = "a51ae015c150ef68f62d9295e3efa9534f492a4a" }
nautilus-risk = { git = "https://github.com/nautechsystems/nautilus_trader", rev = "a51ae015c150ef68f62d9295e3efa9534f492a4a" }
tokio = { version = "1", features = ["test-util"] }
# The mock cTrader peer of the IC adapter's tests.
tungstenite = "0.30"
