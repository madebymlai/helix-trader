[package]
name = "helix-trader"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[workspace]
members = ["crates/ctrader"]
# Plain `cargo test` and `cargo clippy` at the root cover both crates.
default-members = [".", "crates/ctrader"]

[workspace.package]
edition = "2024"
rust-version = "1.99.1"

# The Nautilus pin, one for the workspace, so that both crates build
# against one copy of Nautilus' types; and the versions both crates use.
# Each crate names the features it needs.
[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
ctrader = { path = "crates/ctrader" }
jiff = { version = "0.2", features = ["serde"] }
log = "0.4"
nautilus-analysis = { git = "https://github.com/nautechsystems/nautilus_trader", rev = "8dfef4b7725f8371d96c56cc0c7cdec5525a398d" }
nautilus-backtest = { git = "https://github.com/nautechsystems/nautilus_trader", rev = "8dfef4b7725f8371d96c56cc0c7cdec5525a398d" }
nautilus-common = { git = "https://github.com/nautechsystems/nautilus_trader", rev = "8dfef4b7725f8371d96c56cc0c7cdec5525a398d" }
nautilus-core = { git = "https://github.com/nautechsystems/nautilus_trader", rev = "8dfef4b7725f8371d96c56cc0c7cdec5525a398d" }
nautilus-data = { git = "https://github.com/nautechsystems/nautilus_trader", rev = "8dfef4b7725f8371d96c56cc0c7cdec5525a398d" }
# Keep Nautilus' 64-bit prices, as for nautilus-okx.
nautilus-databento = { git = "https://github.com/nautechsystems/nautilus_trader", rev = "8dfef4b7725f8371d96c56cc0c7cdec5525a398d", default-features = false }
nautilus-execution = { git = "https://github.com/nautechsystems/nautilus_trader", rev = "8dfef4b7725f8371d96c56cc0c7cdec5525a398d" }
nautilus-indicators = { git = "https://github.com/nautechsystems/nautilus_trader", rev = "8dfef4b7725f8371d96c56cc0c7cdec5525a398d" }
nautilus-infrastructure = { git = "https://github.com/nautechsystems/nautilus_trader", rev = "8dfef4b7725f8371d96c56cc0c7cdec5525a398d" }
nautilus-interactive-brokers = { git = "https://github.com/nautechsystems/nautilus_trader", rev = "8dfef4b7725f8371d96c56cc0c7cdec5525a398d", default-features = false }
nautilus-live = { git = "https://github.com/nautechsystems/nautilus_trader", rev = "8dfef4b7725f8371d96c56cc0c7cdec5525a398d" }
nautilus-model = { git = "https://github.com/nautechsystems/nautilus_trader", rev = "8dfef4b7725f8371d96c56cc0c7cdec5525a398d" }
nautilus-network = { git = "https://github.com/nautechsystems/nautilus_trader", rev = "8dfef4b7725f8371d96c56cc0c7cdec5525a398d" }
# Keep Nautilus' 64-bit prices: the crate's default turns on 128-bit prices
# (high-precision) for the whole build.
nautilus-okx = { git = "https://github.com/nautechsystems/nautilus_trader", rev = "8dfef4b7725f8371d96c56cc0c7cdec5525a398d", default-features = false }
nautilus-persistence = { git = "https://github.com/nautechsystems/nautilus_trader", rev = "8dfef4b7725f8371d96c56cc0c7cdec5525a398d" }
nautilus-portfolio = { git = "https://github.com/nautechsystems/nautilus_trader", rev = "8dfef4b7725f8371d96c56cc0c7cdec5525a398d" }
nautilus-risk = { git = "https://github.com/nautechsystems/nautilus_trader", rev = "8dfef4b7725f8371d96c56cc0c7cdec5525a398d" }
nautilus-serialization = { git = "https://github.com/nautechsystems/nautilus_trader", rev = "8dfef4b7725f8371d96c56cc0c7cdec5525a398d" }
nautilus-trading = { git = "https://github.com/nautechsystems/nautilus_trader", rev = "8dfef4b7725f8371d96c56cc0c7cdec5525a398d" }
rust_decimal = "1"
serde = { version = "1", features = ["derive"] }
# Floats read back to the bit: the probes of a stored model.
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.11"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
ustr = "1"

[features]
# The unit tests of the strategies themselves (ema, model_ema and, where it
# exists, gold_scalp): off by default, so that `cargo test` runs the harness
# alone; `cargo test --features strategy-tests` runs them too.
strategy-tests = []

[dependencies]
anyhow.workspace = true
# The arrow schema Nautilus' custom data macros generate, for the dataset
# rows and the custom data of the backtest tests.
arrow = { version = "59.3", default-features = false }
# The version and features of Nautilus' IB gateway.
bollard = { version = "0.21.1", default-features = false, features = ["http", "pipe"] }
bon = "=3.9.3"
clap = { version = "4", features = ["derive", "env"] }
# The cTrader Open API adapter, which IC Markets' venue module wires in.
ctrader.workspace = true
# The version of nautilus-databento, for the dataset's end.
databento = "=0.63.0"
dotenvy = "0.15"
jiff.workspace = true
# LightGBM, built from its C++ sources (needs cmake and clang) without OpenMP:
# one thread, so training is deterministic. Cargo.lock gives its bindgen
# prettyplease 0.3: added beside bon's prettyplease 0.2, Cargo reused 0.2,
# whose syn 2 does not build with bindgen's syn 3.
lightgbm3 = "1.0.11"
log.workspace = true
nautilus-analysis.workspace = true
nautilus-backtest = { workspace = true, features = ["streaming"] }
nautilus-common = { workspace = true, features = ["indicators", "live", "tracing-bridge"] }
nautilus-core.workspace = true
nautilus-data.workspace = true
# `live` for its data client, which fill-catalog's node asks for history.
nautilus-databento = { workspace = true, features = ["live"] }
nautilus-execution.workspace = true
nautilus-indicators.workspace = true
nautilus-infrastructure.workspace = true
nautilus-live = { workspace = true, features = ["streaming"] }
ibapi = "=5.0.0"
nautilus-interactive-brokers = { workspace = true, features = ["execution", "gateway"] }
nautilus-model.workspace = true
nautilus-network.workspace = true
nautilus-okx.workspace = true
nautilus-persistence.workspace = true
# Nautilus' custom data registry and arrow encoding, to store the dataset rows
# in the catalog.
nautilus-serialization = { workspace = true, features = ["arrow"] }
nautilus-trading.workspace = true
# PerpetualBooster: the 3.0 release candidate, the only version that builds
# on stable Rust.
perpetual = "=3.0.0-rc.2"
rust_decimal.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
tokio.workspace = true
toml = "1"
ustr.workspace = true

[dev-dependencies]
# The `DataClient` trait of the test venues' data clients.
async-trait.workspace = true
# The demo test of the cTrader session's token renewal, run on IC's demo.
ctrader = { workspace = true, features = ["demo-test"] }
# Nautilus' Redis client, to delete what the live tests leave in the cache.
redis = { version = "1.7.1", default-features = false, features = ["tokio-comp"] }
nautilus-model = { workspace = true, features = ["test-support"] }
# Nautilus' portfolio, to register a strategy in a unit test.
nautilus-portfolio.workspace = true
tokio = { workspace = true, features = ["test-util"] }

# Line tables only for the workspace's crates, enough for file:line in
# backtraces, and no debug info for dependencies: Nautilus and DataFusion's full debug info made
# each test binary about 1.8 GB.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
