[package]
name = "helix-trader"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "A systematic trading system built on NautilusTrader"
publish = false

[lints]
workspace = true

[workspace]
members = ["crates/ctrader", "crates/lse"]
# Plain `cargo test` and `cargo clippy` at the root cover every crate.
default-members = [".", "crates/ctrader", "crates/lse"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.100.0"
license = "Apache-2.0"

# The Nautilus pin, one for the workspace, so that every crate builds
# against one copy of Nautilus' types; and the versions the crates share.
# Each crate names the features it needs.
[workspace.dependencies]
anyhow = "1"
# The arrow schema of Nautilus' custom data macros, and of LSE's exports.
arrow = { version = "59.3", default-features = false }
async-trait = "0.1"
bon = "=3.9.3"
ctrader = { path = "crates/ctrader" }
jiff = { version = "0.2", features = ["serde"] }
log = "0.4"
lse = { path = "crates/lse" }
nautilus-analysis = { git = "https://github.com/nautechsystems/nautilus_trader", rev = "2d844b3598a117e2677415934e0914c4b409aa62" }
nautilus-backtest = { git = "https://github.com/nautechsystems/nautilus_trader", rev = "2d844b3598a117e2677415934e0914c4b409aa62" }
nautilus-common = { git = "https://github.com/nautechsystems/nautilus_trader", rev = "2d844b3598a117e2677415934e0914c4b409aa62" }
nautilus-core = { git = "https://github.com/nautechsystems/nautilus_trader", rev = "2d844b3598a117e2677415934e0914c4b409aa62" }
nautilus-data = { git = "https://github.com/nautechsystems/nautilus_trader", rev = "2d844b3598a117e2677415934e0914c4b409aa62" }
# Keep Nautilus' 64-bit prices, as for nautilus-okx.
nautilus-databento = { git = "https://github.com/nautechsystems/nautilus_trader", rev = "2d844b3598a117e2677415934e0914c4b409aa62", default-features = false }
nautilus-execution = { git = "https://github.com/nautechsystems/nautilus_trader", rev = "2d844b3598a117e2677415934e0914c4b409aa62" }
nautilus-indicators = { git = "https://github.com/nautechsystems/nautilus_trader", rev = "2d844b3598a117e2677415934e0914c4b409aa62" }
nautilus-infrastructure = { git = "https://github.com/nautechsystems/nautilus_trader", rev = "2d844b3598a117e2677415934e0914c4b409aa62" }
nautilus-interactive-brokers = { git = "https://github.com/nautechsystems/nautilus_trader", rev = "2d844b3598a117e2677415934e0914c4b409aa62", default-features = false }
nautilus-live = { git = "https://github.com/nautechsystems/nautilus_trader", rev = "2d844b3598a117e2677415934e0914c4b409aa62" }
nautilus-model = { git = "https://github.com/nautechsystems/nautilus_trader", rev = "2d844b3598a117e2677415934e0914c4b409aa62" }
nautilus-network = { git = "https://github.com/nautechsystems/nautilus_trader", rev = "2d844b3598a117e2677415934e0914c4b409aa62" }
# Keep Nautilus' 64-bit prices: the crate's default turns on 128-bit prices
# (high-precision) for the whole build.
nautilus-okx = { git = "https://github.com/nautechsystems/nautilus_trader", rev = "2d844b3598a117e2677415934e0914c4b409aa62", default-features = false }
nautilus-persistence = { git = "https://github.com/nautechsystems/nautilus_trader", rev = "2d844b3598a117e2677415934e0914c4b409aa62" }
nautilus-portfolio = { git = "https://github.com/nautechsystems/nautilus_trader", rev = "2d844b3598a117e2677415934e0914c4b409aa62" }
nautilus-risk = { git = "https://github.com/nautechsystems/nautilus_trader", rev = "2d844b3598a117e2677415934e0914c4b409aa62" }
nautilus-serialization = { git = "https://github.com/nautechsystems/nautilus_trader", rev = "2d844b3598a117e2677415934e0914c4b409aa62" }
# Nautilus' testers (`DataTester`), without its datasets.
nautilus-testkit = { git = "https://github.com/nautechsystems/nautilus_trader", rev = "2d844b3598a117e2677415934e0914c4b409aa62", default-features = false, features = [
  "testers",
] }
nautilus-trading = { git = "https://github.com/nautechsystems/nautilus_trader", rev = "2d844b3598a117e2677415934e0914c4b409aa62" }
# Fixtures and cases for every crate's tests (`#[rstest]`), as Nautilus'.
rstest = { version = "0.28.0", default-features = false }
rust_decimal = "1"
serde = { version = "1", features = ["derive"] }
# Floats read back to the bit: the probes of a stored model.
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.11"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
ustr = "1"

# Nautilus' workspace lints (nautilus_trader's Cargo.toml), so that helix
# reads like the code it builds on; each crate takes them with
# `[lints] workspace = true`.
[workspace.lints.clippy]
# Debug markers
dbg_macro = "warn"

# Performance optimizations
redundant_clone = "warn"
unnecessary_to_owned = "warn"
inefficient_to_string = "warn"
cloned_instead_of_copied = "warn"

# Needless code
needless_borrow = "warn"
needless_bool = "warn"
needless_borrows_for_generic_args = "warn"
needless_collect = "warn"
needless_continue = "warn"
needless_late_init = "warn"
needless_lifetimes = "warn"
needless_match = "warn"
needless_option_as_deref = "warn"
needless_pass_by_ref_mut = "warn"
needless_pass_by_value = "warn"
needless_range_loop = "warn"
needless_raw_strings = "warn"
needless_raw_string_hashes = "warn"
needless_return = "warn"
needless_update = "warn"

# Code simplification
redundant_closure = "warn"
# redundant_closure_for_method_calls = "warn" # Pending adapter cleanup; pedantic crates already enable it
collapsible_if = "warn"
collapsible_else_if = "warn"
useless_conversion = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unnecessary_self_imports = "warn"
unnecessary_semicolon = "warn"
unnecessary_sort_by = "warn"
unnecessary_struct_initialization = "warn"
unnecessary_debug_formatting = "warn"
unnecessary_wraps = "warn"
unnecessary_box_returns = "warn"
unnecessary_join = "warn"
unnecessary_literal_bound = "warn"
map_identity = "warn"
if_same_then_else = "warn"
get_first = "warn"
single_char_pattern = "warn"
identity_op = "warn"

# Iterator simplifications
manual_flatten = "warn"
iter_kv_map = "warn"
bytes_count_to_len = "warn"
unnecessary_filter_map = "warn"

# Option/Result simplifications
unnecessary_lazy_evaluations = "warn"
option_as_ref_deref = "warn"

# Manual pattern simplifications
manual_filter = "warn"
manual_find = "warn"
manual_while_let_some = "warn"
range_plus_one = "warn"
checked_conversions = "warn"
manual_strip = "warn"
manual_split_once = "warn"
manual_is_ascii_check = "warn"
manual_range_contains = "warn"
manual_string_new = "warn"
manual_instant_elapsed = "warn"

# Pointer casts
ref_as_ptr = "warn"

# Style/idioms
use_self = "warn"
# default_trait_access = "warn" # TODO: Enable (~170 warnings)
redundant_field_names = "warn"
match_like_matches_macro = "warn"
manual_map = "warn"
bool_to_int_with_if = "warn"
explicit_iter_loop = "warn"
uninlined_format_args = "warn"

# Pedantic (explicitness and clarity)
borrow_as_ptr = "warn"
copy_iterator = "warn"
expl_impl_clone_on_copy = "warn"
inconsistent_struct_constructor = "warn"
iter_nth_zero = "warn"
map_flatten = "warn"
match_bool = "warn"
mut_mut = "warn"
naive_bytecount = "warn"
option_option = "warn"
ptr_as_ptr = "warn"
verbose_bit_mask = "warn"
semicolon_if_nothing_returned = "warn"
unnested_or_patterns = "warn"
filter_map_next = "warn"
flat_map_option = "warn"
map_unwrap_or = "warn"
implicit_clone = "warn"
return_self_not_must_use = "warn"
explicit_into_iter_loop = "warn"
stable_sort_primitive = "warn"
needless_for_each = "warn"
manual_is_variant_and = "warn"
equatable_if_let = "warn"
manual_assert = "warn"
items_after_statements = "warn"
ignored_unit_patterns = "warn"
if_not_else = "warn"

# Security and robustness
disallowed_methods = "warn"
disallowed_types = "warn"
exit = "warn"
suspicious_doc_comments = "warn"
large_stack_arrays = "warn"
panic_in_result_fn = "warn"
unimplemented = "warn"
mem_forget = "warn"
multiple_unsafe_ops_per_block = "warn"
unchecked_time_subtraction = "warn"

# Numeric correctness
float_cmp_const = "warn"
lossy_float_literal = "warn"
invalid_upcast_comparisons = "warn"

# API hygiene
rc_mutex = "warn"
rc_buffer = "warn"
empty_drop = "warn"
rest_pat_in_fully_bound_structs = "warn"
iter_not_returning_iterator = "warn"
infallible_try_from = "warn"
debug_assert_with_mut_call = "warn"

# Async correctness
await_holding_lock = "warn"
await_holding_refcell_ref = "warn"
let_underscore_future = "warn"
large_futures = "warn"
if_let_mutex = "warn"

# TODO: Don't fail silently. Incremental rollout needed (~1400 sites workspace-wide)
# let_underscore_must_use = "warn"
# unused_result_ok = "warn"
# assertions_on_result_states = "warn"
# map_err_ignore = "warn"

# Shared allowances, also generated after source pedantic opt-ins by
# scripts/update-clippy-allowances.py because attributes override Cargo flags.
redundant_else = "allow" # Sometimes explicit else blocks improve readability
single_match_else = "allow" # Match can be clearer than if-let-else for some patterns
manual_let_else = "allow" # Match can be clearer than let-else for some patterns
or_fun_call = "allow" # Used consistently for display with map_or("None".to_string(), ...)
option_if_let_else = "allow" # if-let can be clearer than map_or/map_or_else
similar_names = "allow" # Domain terms like trade/trader and side/size are intentionally similar

# TODO: Enable these incrementally (widespread usage in codebase)
# unwrap_used = "warn"        # Forces explicit error handling instead of panics
# expect_used = "warn"        # Forces explicit error handling instead of panics
# indexing_slicing = "warn"   # Prevents panics from out-of-bounds access

[workspace.lints.rust]
unreachable_pub = "deny"

# The crate release cooldown (scripts/check-cargo-cooldown.sh, as Nautilus
# sets it): a crates.io version enters Cargo.lock 3 days after publication.
[workspace.metadata.cooldown]
days = 3
trusted-base = "origin/develop"

# The typos spell checker's config (typos reads it here).
[workspace.metadata.typos.default]
locale = "en-us"

[workspace.metadata.typos.default.extend-words]
# A model's valid-from timestamps (`valid_froms`)
froms = "froms"
# Industry standard abbreviations and technical terms
Pn = "Pn" # Part of PnL (Profit and Loss)
PnL = "PnL" # Profit and Loss
PnLs = "PnLs" # Plural of PnL
ND = "ND" # Ordinal suffix (`ON_THE_22ND`)
# Futures roots and contract symbols
SIZ = "SIZ" # COMEX silver root with its month (`SIZ26`)
# Misspelled config keys the tests refuse
sesion = "sesion"
spred = "spred"
leafs = "leafs"

[workspace.metadata.typos.files]
# Preserve vendored code and verbatim data
extend-exclude = [
  "crates/ctrader/proto/",
  "crates/lse/docs-snapshot/",
  "**/test_data/**/*.json",
  "**/test_data/**/*.txt",
]

[features]
# Strategy unit tests, off by default (see the README's tests section).
strategy-tests = []
# The fake learner (`learner = { kind = "fake" }`), test support: the self
# dev-dependency below turns it on in every test build, so the binary the
# integration tests run selects it, while a build of the binary alone refuses
# it.
test-support = []

# cargo-machete reads source for a dependency's name: the arrow schema of the
# custom data macros is in their expansion alone.
[package.metadata.cargo-machete]
ignored = ["arrow"]

[dependencies]
# The quote maps of Nautilus' exchange-rate path search
# (`nautilus_common::xrate::get_exchange_rate`), which the conversions'
# balance check asks.
ahash = "0.8"
anyhow.workspace = true
# The arrow schema Nautilus' custom data macros generate, for the dataset
# rows and the custom data of the backtest tests.
arrow.workspace = true
# The version and features of Nautilus' IB gateway.
bollard = { version = "0.21.1", default-features = false, features = [
  "http",
  "pipe",
] }
bon.workspace = true
clap = { version = "4", features = ["derive", "env"] }
# The cTrader Open API adapter, which the IC Markets and Pepperstone venues wire in.
ctrader.workspace = true
dotenvy = "0.15"
ibapi = "=5.0.0"
jiff.workspace = true
# LightGBM, built from its C++ sources (needs cmake and clang) without OpenMP:
# one thread, so training is deterministic. Cargo.lock gives its bindgen
# prettyplease 0.3: added beside bon's prettyplease 0.2, Cargo reused 0.2,
# whose syn 2 does not build with bindgen's syn 3.
lightgbm3 = "1.0.11"
log.workspace = true
# The LSE adapter, which the LSEDGE venue wires in.
lse.workspace = true
nautilus-analysis.workspace = true
nautilus-backtest = { workspace = true, features = ["streaming"] }
nautilus-common = { workspace = true, features = [
  "indicators",
  "live",
  "tracing-bridge",
] }
nautilus-core.workspace = true
nautilus-data.workspace = true
# `live` for its data client, which fill-catalog's node asks for history;
# `arrow` for the Arrow schemas of its custom data types, which helix registers
# with every type it compiles (`venues::register_custom_data`).
nautilus-databento = { workspace = true, features = ["arrow", "live"] }
nautilus-execution.workspace = true
nautilus-indicators.workspace = true
nautilus-infrastructure.workspace = true
nautilus-interactive-brokers = { workspace = true, features = [
  "execution",
  "gateway",
] }
nautilus-live = { workspace = true, features = ["streaming"] }
nautilus-model.workspace = true
nautilus-network.workspace = true
nautilus-okx.workspace = true
nautilus-persistence.workspace = true
# Nautilus' fixed-risk position sizer, which sizes a trade from its stake.
nautilus-risk.workspace = true
# Nautilus' custom data registry and arrow encoding, to store the dataset rows
# in the catalog.
nautilus-serialization = { workspace = true, features = ["arrow"] }
nautilus-trading.workspace = true
# PerpetualBooster: the 3.0 release candidate, the only version that builds
# on stable Rust.
perpetual = "=3.0.0-rc.2"
rust_decimal.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
tokio.workspace = true
toml = "1"
ustr.workspace = true

# getrusage, for the CPU time and peak memory `train` reports
# (`model::report`), which Nautilus does not read: Unix alone. Already in the
# tree, Nautilus' and Tokio's.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# The `DataClient` trait of the test venues' data clients.
async-trait.workspace = true
# The hooks of the demo test of the cTrader session's token renewal
# (`tests/live/ctrader_token_demo.rs`).
ctrader = { workspace = true, features = ["test-support"] }
# The seeded generator of the property tests' draws (`prop_*`), already in
# the tree through tempfile.
fastrand = "2.5"
# The crate's own `test-support`, for the unit tests and the binary the
# integration tests run.
helix-trader = { path = ".", features = ["test-support"] }
# The mock LSE peer and its captured payloads, for the tests of the LSE fill.
lse = { workspace = true, features = ["test-support"] }
nautilus-model = { workspace = true, features = ["test-support"] }
# Nautilus' portfolio, to register a strategy in a unit test.
nautilus-portfolio.workspace = true
# Nautilus' Redis client, to delete what the live tests leave in the cache.
redis = { version = "1.7.1", default-features = false, features = [
  "tokio-comp",
] }
rstest.workspace = true

# Line tables only for the workspace's crates, enough for file:line in
# backtraces, and no debug info for dependencies: Nautilus and DataFusion's full debug info made
# each test binary about 1.8 GB.
[profile.dev]
debug = "line-tables-only"

# Dependencies at opt-level 1, helix's own crates at 0, as Nautilus builds
# them: dependencies recompile rarely, and the backtests and trains of the
# tests spend most of their time in them.
[profile.dev.package."*"]
debug = false
opt-level = 1
