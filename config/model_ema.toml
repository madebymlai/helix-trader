# Model EMA (`src/strategy/model_ema/`), read into `ModelEmaConfig`: an
# example strategy trading on a learned model, whose features are a fast
# and a slow EMA of each bars series it reads, set in [indicators]:
#   cargo run --release -- train model_ema --config config/model_ema.toml ...
#   cargo run --release -- backtest model_ema --config config/model_ema.toml ...
# Every field is described in `src/strategy/README.md`.
#
# Its trades are its model's decisions, sent as given: the target its
# model learned, [model].target, here a bracket closed at its limit.

# Nautilus' StrategyConfig; defaults to MODEL_EMA-001 when left out, and
# Nautilus tags the strategy's orders with the id's tag, 001. The strategy
# id keys the model's store.
# [base]
# strategy_id = "MODEL_EMA-001"

[data]
# The series read (all stored in the catalog): hourly bars of the mid,
# built by Nautilus from the quotes, of each instrument; each gives the
# model its two averages. A model strategy lists the series its features
# or its target's ATR read, and no other, or no run starts.
series = [
    { data = "bars", instrument_id = "XAUUSD.ICMARKETS", bar_spec = { step = 1, aggregation = "HOUR", price_type = "MID" } },
    { data = "bars", instrument_id = "EURUSD.ICMARKETS", bar_spec = { step = 1, aggregation = "HOUR", price_type = "MID" } },
]
# How far back a live node's warmup request goes at start, and a dataset
# build's lead-in: enough for the slow average's 30 bars and the target's
# ATR.
warmup = "72h"

# The model's two averages of each bars series' closes, each a Nautilus
# ExponentialMovingAverage by its constructor's arguments, as the EMA
# crossover's: `period` in bars, and optionally `price_type`, the price it
# reads of quotes (LAST by default; bars give their close). Each feature is
# named after its bars and its table, XAUUSD.ICMARKETS-1-HOUR-MID-INTERNAL:fast
# and so on (after its table alone, `fast`, if one bars series is read).
# The arguments key the dataset and the models by value: another period
# rebuilds them, the same one written otherwise does not.
[indicators.fast]
period = 10

[indicators.slow]
period = 30

[trade]
# The one instrument traded, whose target the model learns, and the size
# of each of the model's trades.
instruments = [{ instrument_id = "XAUUSD.ICMARKETS", trade_size = "1" }]
# The fraction of equity a trade sent at the config's stake risks over its
# one R (see config/ema.toml); the model's trades are of trade_size.
risk = "0.5%"

# The model, of a strategy trading on one: its target trades [trade]'s
# instrument, of its trade_size.
[model]
# A decision every hour, on the hour's bars.
decision = { every = "1h" }
# The target of each decision, which the models learn and the strategy
# sends: a bracket, its take profit 2 and its stop 1 average true ranges
# from the decision's price (Nautilus' AverageTrueRange of the hourly bars,
# by its arguments), closed 45 minutes after its send if neither is reached,
# before the next decision. Without its bracket, `{ limit = "45m", atr = {
# period = 14 } }` is a trade closed at its time alone, its P&L read over the
# worth of its ATR, declared beside the limit, as a stop's distance.
target = { bracket = { take_profit = { atr = 2.0 }, stop = { atr = 1.0 }, atr = { period = 14, ma_type = "WILDER" } }, limit = "45m" }
# Retrained weekly on the last 30 days, the last 5 held out to score it.
retrain = "168h"
window = "720h"
holdout = "120h"
# Both sides traded, each from an expected net 0.03R a trade, R the money
# its stop risks: 3% of that, about 0.45 USD on an ounce with gold's hourly
# ATR near 15 USD. A margin is in R, written with its suffix.
margins = { long = "0.03R", short = "0.03R" }
# The sides' models are published together if the trades picked between them
# earn at least 1 USD a trade over at least 30 trades of the holdout.
min_pnl = 1.0
min_trades = 30
# LightGBM, its trees of up to 31 leaves of 20 rows at least, over 100
# rounds at a rate of 0.1: each side's model is fitted on the window less
# the holdout and the calibration before it, as long, 20 days of which 14
# or 15 are weekdays, 320 to 345 hourly decisions, too few for the
# learner's default leaves of 200 rows to split.
learner = { kind = "lightgbm", num_iterations = 100, learning_rate = 0.1, num_leaves = 31, min_data_in_leaf = 20 }
